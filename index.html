<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minesweeper</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #222;
  color: white;
  margin: 0;
}
h1 { margin-top: 10px; }
#boardContainer {
  width: 100%;
  height: 80vh;
  overflow: auto;
  display: flex;
  justify-content: center;
}
#board {
  display: grid;
  margin-top: 20px;
  grid-auto-rows: 20px;
}
.cell {
  width: 20px;
  height: 20px;
  border: 1px solid #555;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-weight: bold;
  user-select: none;
  background-image: url('https://imgur.com/a/C9FLhOB.png'); /* online tile image */
  background-size: cover;
  background-position: center;
}
.cell.revealed {
  background: #bbb !important;
  color: black;
  cursor: default;
  background-image: none;
}
.cell.mine {
  background: red !important;
}
.cell.flag {
  background: orange !important;
}
#deathScreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 999;
}
#deathScreen img {
  max-width: 300px;
  border-radius: 20px;
}
#deathScreen h2 {
  color: red;
  margin-top: 20px;
  font-size: 40px;
}
#retryBtn {
  margin-top: 20px;
  padding: 10px 20px;
  font-size: 18px;
  cursor: pointer;
  border: none;
  border-radius: 10px;
  background: white;
}
</style>
</head>
<body>
<h1>Minesweeper</h1>
<button onclick="init()">Restart</button>
<div id="boardContainer">
  <div id="board"></div>
</div>
<div id="deathScreen">
  <img src="https://i.imgur.com/8JYjvFQ.png" alt="death">
  <h2>YOU DIED</h2>
  <button id="retryBtn" onclick="init()">Retry</button>
</div>

<script>
const rows = 100;
const cols = 100;
const minesCount = Math.floor(rows * cols * 0.15);
let board = [];
let mineLocations = new Set();

function init() {
  board = [];
  mineLocations.clear();
  document.getElementById("deathScreen").style.display = "none";

  const boardDiv = document.getElementById("board");
  boardDiv.innerHTML = "";
  boardDiv.style.gridTemplateColumns = `repeat(${cols}, 20px)`;

  for (let r = 0; r < rows; r++) {
    let row = [];
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement("div");
      cell.classList.add("cell");
      cell.dataset.r = r;
      cell.dataset.c = c;

      cell.addEventListener("click", clickCell);
      cell.addEventListener("contextmenu", rightClickCell);

      boardDiv.appendChild(cell);
      row.push(cell);
    }
    board.push(row);
  }

  placeMines();
}

function placeMines() {
  let placed = 0;
  while (placed < minesCount) {
    const r = Math.floor(Math.random() * rows);
    const c = Math.floor(Math.random() * cols);
    const key = `${r}-${c}`;
    if (!mineLocations.has(key)) {
      mineLocations.add(key);
      placed++;
    }
  }
}

function clickCell(e) {
  const cell = e.target;
  const r = parseInt(cell.dataset.r);
  const c = parseInt(cell.dataset.c);

  if (cell.classList.contains("revealed") || cell.classList.contains("flag")) return;

  const key = `${r}-${c}`;
  if (mineLocations.has(key)) {
    cell.classList.add("mine");
    cell.textContent = "💣";
    revealAll();
    document.getElementById("deathScreen").style.display = "flex";
    return;
  }

  floodFill(r, c);
  checkWin();
}

function rightClickCell(e) {
  e.preventDefault();
  const cell = e.target;
  if (cell.classList.contains("revealed")) return;
  if (cell.classList.contains("flag")) {
    cell.classList.remove("flag");
    cell.textContent = "";
  } else {
    cell.classList.add("flag");
    cell.textContent = "🚩";
  }
}

function countMines(r, c) {
  let count = 0;
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      const nr = r + dr;
      const nc = c + dc;
      if (mineLocations.has(`${nr}-${nc}`)) count++;
    }
  }
  return count;
}

function floodFill(r, c) {
  const queue = [[r, c]];
  while (queue.length) {
    const [cr, cc] = queue.shift();
    const cell = board[cr][cc];
    if (cell.classList.contains("revealed")) continue;

    const count = countMines(cr, cc);
    cell.classList.add("revealed");
    if (count > 0) {
      cell.textContent = count;
    } else {
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = cr + dr;
          const nc = cc + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
            const neighbor = board[nr][nc];
            if (!neighbor.classList.contains("revealed")) queue.push([nr, nc]);
          }
        }
      }
    }
  }
}

function revealAll() {
  mineLocations.forEach(loc => {
    const [r, c] = loc.split("-").map(Number);
    const cell = board[r][c];
    cell.textContent = "💣";
    cell.classList.add("mine");
  });
}

function checkWin() {
  let unrevealed = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (!board[r][c].classList.contains("revealed") && !mineLocations.has(`${r}-${c}`)) {
        unrevealed++;
      }
    }
  }
  if (unrevealed === 0) {
    alert("YOU WIN!");
  }
}

init();
</script>
</body>
</html>
